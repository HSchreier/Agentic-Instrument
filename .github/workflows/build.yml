name: Build Docker Images

on:
  push:
    branches: [dev, main]
    paths:
      - 'Dockerfile'
      - 'backend/Dockerfile'
      - 'frontend/Dockerfile'
      - 'docker-compose.yml'

jobs:
  build-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build CLI image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: rhythm-wolf:cli-${{ github.sha }}
          cache-from: type=registry,ref=rhythm-wolf:cli-latest
          cache-to: type=inline

  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build backend image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./backend/Dockerfile
          push: false
          tags: rhythm-wolf:backend-${{ github.sha }}
          cache-from: type=registry,ref=rhythm-wolf:backend-latest
          cache-to: type=inline

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build frontend image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: rhythm-wolf:frontend-${{ github.sha }}
          cache-from: type=registry,ref=rhythm-wolf:frontend-latest
          cache-to: type=inline
