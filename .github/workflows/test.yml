name: Test & Lint

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run type-check

      - name: Lint
        run: bun run lint || true  # Non-blocking

      - name: Run tests
        run: bun run test

      - name: Generate coverage
        run: bun run test:coverage || true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./frontend/coverage/coverage-final.json
          flags: frontend
          fail_ci_if_error: false

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run tests
        run: pytest -v --cov=backend --cov-report=xml
        continue-on-error: true
        env:
          # Note: Claude API key would be set here in production
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || '' }}

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

  integration:
    runs-on: ubuntu-latest
    needs: [frontend, backend]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Build frontend
        working-directory: ./frontend
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Verify backend
        working-directory: ./backend
        run: |
          pip install -r requirements.txt
          python -c "from main import app; print('Backend imports OK')"

      - name: Check Docker files
        run: |
          docker run --rm -i hadolint/hadolint < Dockerfile
          docker run --rm -i hadolint/hadolint < frontend/Dockerfile
          docker run --rm -i hadolint/hadolint < backend/Dockerfile

  all-checks:
    if: always()
    needs: [frontend, backend, integration]
    runs-on: ubuntu-latest

    steps:
      - name: Decide whether the needed jobs succeeded or failed
        run: |
          if [[ ${{ needs.frontend.result }} == 'success' && ${{ needs.backend.result }} == 'success' && ${{ needs.integration.result }} == 'success' ]]; then
            exit 0
          else
            exit 1
          fi
