name: Deploy to Dev

on:
  push:
    branches: [dev]
  workflow_run:
    workflows: ["Test & Lint"]
    types: [completed]
    branches: [dev]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - name: Run semantic versioning check
        run: |
          # Check if commit message contains version bump
          if git log -1 --pretty=%B | grep -E "^(feat|fix|refactor|docs|chore)(\(.+\))?!?:" ; then
            echo "COMMIT_TYPE=$(git log -1 --pretty=%B | head -1 | cut -d':' -f1)" >> $GITHUB_ENV
          fi

      - name: Create deployment status
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'dev',
              environment: 'development',
              required_contexts: [],
              auto_merge: false,
            })

      - name: Send Slack notification (optional)
        uses: slackapi/slack-github-action@v1.24.0
        if: always()
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "🚀 Deploy to Dev: ${{ job.status }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Rhythm Wolf Deploy to Dev*\nStatus: `${{ job.status }}`\nCommit: `${{ github.sha }}`\nAuthor: ${{ github.actor }}"
                  }
                }
              ]
            }

      - name: Verification
        run: |
          echo "✅ Dev deployment verified"
          echo "Branch: dev"
          echo "Commit: ${{ github.sha }}"
          echo "Build URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
